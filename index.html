<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Men - Seleção de Personagens</title>
    <link rel="stylesheet" href="src/styles/character-selector.css" />
  </head>
  <body>
    <header>
      <h1>🧬 X-Men: Escolha seu personagem</h1>
      <p class="subtitle">Use TAB para navegar, ENTER/SPACE para selecionar</p>
    </header>

    <main>
      <!-- Container que será renderizado pelo JavaScript -->
      <div id="character-grid" class="character-grid" role="list">
        <!-- Personagens serão inseridos aqui -->
      </div>
    </main>

    <footer>
      <p>Pressione ESC para deselecionar</p>
    </footer>

    <!-- Script principal -->
    <script type="module">
      import { initCharacterSelector } from "./src/components/CharacterSelector.js";

      // Inicializa o seletor de personagens
      initCharacterSelector("character-grid");

      // Exemplo: ouvir seleção
      document.addEventListener("characterSelected", (e) => {
        console.log(
          `Personagem ${e.detail.characterId} selecionado: ${e.detail.selected}`,
        );
      });
    </script>
  </body>
</html>
